name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  # Host-side unit tests for include/calium_core.hpp. Needs no Geode SDK and no GL: this is the
  # cheapest possible check of the culling maths, the adaptive controller and the pass planner, and
  # it is the only part of the mod that can be verified without a GPU in the loop.
  tests:
    name: Core tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure tests
        run: cmake -S tests -B build-tests

      - name: Build tests
        run: cmake --build build-tests

      - name: Run tests
        run: ctest --test-dir build-tests --output-on-failure

  # Five platform builds. The runner OS is fixed by what each target needs: iOS can only be built on
  # macOS (the action asks xcrun for the iPhoneOS SDK), Android only on Linux (the action hardcodes
  # the NDK path and toolchain file that the ubuntu image ships).
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

          - name: macOS
            os: macos-latest

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: Build ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to a commit SHA rather than @main, so a change upstream cannot break this workflow
      # silently. The released v1 tags do not list iOS as a target.
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@a0f7676e6fcd1a584f6d0c1c800239008412defc
        with:
          # "given" takes the SDK version from mod.json, which says 5.11.2 - the loader Geode ships
          # for GD 2.2081. Pinning it here is what stops a future "latest" (6.x targets GD 2.2091)
          # from producing a .geode this game cannot load.
          sdk: given
          combine: true
          target: ${{ matrix.config.target }}

  # Merges the five platform builds into ONE .geode that installs on all of them.
  # Upload that file (not the per-platform ones) when you publish.
  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@a0f7676e6fcd1a584f6d0c1c800239008412defc
        id: build

      - name: Upload combined .geode
        uses: actions/upload-artifact@v4
        with:
          name: Calium-all-platforms
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
